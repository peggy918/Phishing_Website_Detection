# 品牌對照表：品牌近似特徵、白名單與判斷原因都從這裡取。
# aliases：用於對應政府資料「一頁式數位經濟詐騙網站」欄位與簡訊文字（不分大小寫，子字串比對，先列者優先）。
# domains：官方註冊網域（eTLD+1）。每個網域的歸屬佐證記在資料庫（初始資料：data/reference/domain_reviews.csv、
#   whois_summary.csv），沒有佐證的網域仍算官方網域，但不進白名單。2026-11-08 由 AI 以 TWNIC WHOIS、Wikidata、
#   RDAP 查證，不連線被查的網域；原本的 verified 欄位已移除。
# keywords：品牌在網域中常見的字串片段，用於品牌近似判斷。
# source：v2fly 代表網域取自 https://github.com/v2fly/domain-list-community/tree/master/data（MIT 授權，2026-10-31 取得），
#         只保留註冊網域，CDN 主機（full:）與非台灣相關網域不收。未註明者為 AI 依常識整理。
# related_domains：同集團但不同公司的網域（例如國泰人壽之於國泰世華）。列入白名單，但不是該品牌的官方網域。
# 2026-10-31 以 TWNIC WHOIS 核對註冊者後補入的網域，摘要見 data/reference/whois_summary.csv，完整回應只存本機資料庫。
# no_whitelist：官方網域，但任何人都能放內容或做短網址（OneDrive、Facebook、LINE 邀請連結…）。
#   仍算官方、不觸發冒用規則，但不進白名單，交給模型判斷（2026-11-03 本人決定）。
