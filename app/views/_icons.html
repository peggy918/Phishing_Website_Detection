{% macro icon(name) %}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

  {%- elif name == 'chip' %}<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>

  {%- elif name == 'medium' %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
  {%- elif name == 'low' %}<circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/>

</svg>
{% endmacro %}
